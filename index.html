<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171715">
  <meta name="description" content="Save the date: Enzo and Kat are getting married on June 25, 2027, in Antipolo City.">
  <title>Save the Date — Enzo &amp; Kat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --ivory: #f5f3ef;
      --paper: #fbfaf8;
      --ink: #20201e;
      --muted: #777570;
      --silver: #aaa7a0;
      --line: #dedbd5;
      --serif: "Playfair Display", Georgia, serif;
      --sans: "DM Sans", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    .skip-link { position: absolute; top: -50px; left: 16px; z-index: 5; padding: 10px 14px; background: white; }
    .skip-link:focus { top: 16px; }

    .hero {
      position: relative;
      isolation: isolate;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      padding: 34px 22px 58px;
      color: #fff;
      text-align: center;
      background: #282724 url("./Enzo%20%26%20Kat/Header.JPG") center 48% / cover no-repeat;
    }
    .hero::before { position: absolute; z-index: -1; inset: 0; content: ""; background: linear-gradient(180deg, rgba(15, 15, 14, .3), rgba(15, 15, 14, .16) 38%, rgba(15, 15, 14, .62)); }
    .hero-content { width: min(100%, 850px); padding: 42px 18px; }
    .hero-logo { display: block; width: 100px; height: 66px; margin: 0 auto 30px; object-fit: contain; mix-blend-mode: screen; }
    .eyebrow { margin: 0 0 19px; font-size: 10px; font-weight: 500; letter-spacing: .3em; text-transform: uppercase; }
    h1 { margin: 0; font-family: var(--serif); font-size: clamp(56px, 10.5vw, 116px); font-weight: 400; line-height: 1.03; letter-spacing: -.055em; text-wrap: balance; }
    h1 .amp { display: inline-block; padding: 0 .11em; color: #dedbd5; font-size: .66em; font-style: italic; }
    .hero-date { margin: 28px 0 0; font-size: 11px; font-weight: 500; letter-spacing: .28em; text-transform: uppercase; }
    .hero-rule { width: 46px; height: 1px; margin: 30px auto 0; background: rgba(255,255,255,.72); }
    .scroll-cue { position: absolute; bottom: 25px; left: 50%; display: grid; justify-items: center; gap: 9px; transform: translateX(-50%); color: rgba(255,255,255,.85); font-size: 9px; letter-spacing: .2em; text-decoration: none; text-transform: uppercase; }
    .scroll-cue::after { width: 1px; height: 25px; content: ""; background: rgba(255,255,255,.7); }

    .details { position: relative; padding: clamp(78px, 10vw, 116px) 24px clamp(82px, 11vw, 126px); text-align: center; }
    .details-inner { width: min(100%, 680px); margin: 0 auto; }
    .details-logo { width: 95px; height: 63px; margin: 0 auto 29px; object-fit: contain; mix-blend-mode: multiply; }
    .section-label { margin: 0 0 15px; color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: .25em; text-transform: uppercase; }
    h2 { margin: 0; font-family: var(--serif); font-size: clamp(37px, 6vw, 62px); font-weight: 400; letter-spacing: -.04em; }
    .place { margin: 15px 0 0; color: #5c5a56; font-family: var(--serif); font-size: clamp(20px, 3vw, 26px); font-style: italic; }
    .detail-rule { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 31px auto; color: #77746e; font-size: 13px; }
    .detail-rule::before, .detail-rule::after { width: 45px; height: 1px; content: ""; background: var(--line); }
    .formal-note { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: .08em; }

    .gallery { padding: clamp(70px, 9vw, 108px) 22px 88px; background: var(--ivory); text-align: center; }
    .gallery-heading { margin: 0 auto 34px; }
    .gallery-heading h2 { font-size: clamp(34px, 5vw, 52px); }
    .gallery-heading .section-label { margin-bottom: 12px; }
    .carousel { position: relative; width: min(100%, 1050px); margin: 0 auto; }
    .carousel-frame { position: relative; overflow: hidden; aspect-ratio: 16 / 9; background: #dedbd5; }
    .carousel-image { display: block; width: 100%; height: 100%; object-fit: cover; filter: saturate(.18); transition: opacity .25s ease; }
    .carousel-control { position: absolute; top: 50%; display: grid; width: 48px; height: 48px; place-items: center; transform: translateY(-50%); border: 1px solid rgba(255,255,255,.72); border-radius: 50%; background: rgba(24,24,23,.4); color: #fff; cursor: pointer; font-size: 25px; line-height: 1; transition: background .2s ease; }
    .carousel-control:hover, .carousel-control:focus-visible { background: rgba(24,24,23,.78); }
    .carousel-control:focus-visible, .dot:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .carousel-control.prev { left: 18px; }
    .carousel-control.next { right: 18px; }
    .gallery-bottom { display: flex; align-items: center; justify-content: center; gap: 18px; padding-top: 21px; }
    .gallery-caption { min-width: 120px; margin: 0; color: var(--muted); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
    .gallery-dots { display: flex; gap: 8px; }
    .dot { width: 7px; height: 7px; padding: 0; border: 1px solid #77746e; border-radius: 50%; background: transparent; cursor: pointer; }
    .dot[aria-current="true"] { background: #4a4945; }

    footer { display: grid; min-height: 190px; place-content: center; justify-items: center; gap: 10px; padding: 31px 20px; color: var(--ivory); background: #20201e; text-align: center; }
    .footer-logo { display: block; width: 84px; height: 55px; object-fit: contain; mix-blend-mode: screen; }
    footer p { margin: 0; color: #d3d1cc; font-family: var(--serif); font-size: 15px; font-style: italic; }

    @media (min-width: 900px) { .hero { background-position: center 45%; } }
    @media (max-width: 600px) {
      .hero { min-height: 90vh; min-height: 90svh; background-position: 54% center; }
      .hero-content { padding: 30px 12px 48px; }
      .hero-logo { width: 84px; height: 56px; margin-bottom: 27px; }
      .eyebrow { font-size: 9px; letter-spacing: .25em; }
      .hero-date { margin-top: 24px; font-size: 10px; letter-spacing: .2em; }
      .scroll-cue { bottom: 17px; }
      .details-logo { width: 82px; height: 56px; margin-bottom: 25px; }
      .gallery { padding: 65px 14px 72px; }
      .carousel-frame { aspect-ratio: 4 / 3; }
      .carousel-control { width: 40px; height: 40px; }
      .carousel-control.prev { left: 10px; }
      .carousel-control.next { right: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#details">Skip to wedding details</a>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-content">
        <img class="hero-logo" src="./Enzo%20%26%20Kat/Logo_Light.jpg" alt="Enzo and Kat monogram">
        <p class="eyebrow">Together with our families</p>
        <h1 id="hero-title">Save the Date<br>Enzo <span class="amp">&amp;</span> Kat</h1>
        <p class="hero-date"><time datetime="2027-06-25">June 25, 2027</time></p>
        <div class="hero-rule" aria-hidden="true"></div>
      </div>
      <a class="scroll-cue" href="#details" aria-label="Scroll to wedding details">Discover</a>
    </section>

    <section class="details" id="details" aria-labelledby="details-title">
      <div class="details-inner">
        <img class="details-logo" src="./Enzo%20%26%20Kat/Logo_black.jpg" alt="">
        <p class="section-label">The beginning of forever</p>
        <h2 id="details-title">Join us in celebrating</h2>
        <p class="place">Antipolo City</p>
        <div class="detail-rule" aria-hidden="true">✦</div>
        <p class="formal-note">Formal invitation to follow</p>
      </div>
    </section>

    <section class="gallery" aria-labelledby="gallery-title">
      <div class="gallery-heading">
        <p class="section-label">A moment in time</p>
        <h2 id="gallery-title">A little glimpse of us</h2>
      </div>
      <div class="carousel" aria-roledescription="carousel" aria-label="Enzo and Kat's prenup photos">
        <div class="carousel-frame" aria-live="polite">
          <img class="carousel-image" id="carousel-image" src="./Enzo%20%26%20Kat/5Q1A8634.JPG" alt="Enzo and Kat during their prenup photoshoot">
          <button class="carousel-control prev" type="button" aria-label="Previous photo">‹</button>
          <button class="carousel-control next" type="button" aria-label="Next photo">›</button>
        </div>
        <div class="gallery-bottom">
          <p class="gallery-caption" id="gallery-caption">Photo 1 of 2</p>
          <div class="gallery-dots" role="group" aria-label="Choose a photo">
            <button class="dot" type="button" aria-label="Show photo 1" aria-current="true"></button>
            <button class="dot" type="button" aria-label="Show photo 2" aria-current="false"></button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer>
    <img class="footer-logo" src="./Enzo%20%26%20Kat/Logo_Light.jpg" alt="Enzo and Kat monogram">
    <p>We can't wait to celebrate with you.</p>
  </footer>
  <script>
    (() => {
      const photos = [
        { src: './Enzo%20%26%20Kat/5Q1A8634.JPG', alt: 'Enzo and Kat together during their prenup photoshoot' },
        { src: './Enzo%20%26%20Kat/5Q1A9347.JPG', alt: 'Another moment from Enzo and Kat’s prenup photoshoot' }
      ];
      const image = document.querySelector('#carousel-image');
      const caption = document.querySelector('#gallery-caption');
      const dots = [...document.querySelectorAll('.dot')];
      let current = 0;
      function showPhoto(index) {
        current = (index + photos.length) % photos.length;
        image.src = photos[current].src;
        image.alt = photos[current].alt;
        caption.textContent = `Photo ${current + 1} of ${photos.length}`;
        dots.forEach((dot, dotIndex) => dot.setAttribute('aria-current', String(dotIndex === current)));
      }
      document.querySelector('.prev').addEventListener('click', () => showPhoto(current - 1));
      document.querySelector('.next').addEventListener('click', () => showPhoto(current + 1));
      dots.forEach((dot, index) => dot.addEventListener('click', () => showPhoto(index)));
    })();
  </script>
</body>
</html>
