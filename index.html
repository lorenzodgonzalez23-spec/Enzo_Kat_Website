<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ed">
  <meta name="description" content="Save the date: Enzo and Kat are getting married on June 25, 2027, in Antipolo City.">
  <title>Save the Date — Enzo &amp; Kat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --ivory: #f6f3ed;
      --ink: #292a24;
      --olive: #747763;
      --muted: #77776d;
      --line: #dedbd2;
      --serif: "Playfair Display", Georgia, serif;
      --sans: "DM Sans", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--ivory); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    .skip-link { position: absolute; top: -50px; left: 16px; z-index: 5; padding: 10px 14px; background: white; }
    .skip-link:focus { top: 16px; }

    .hero {
      position: relative;
      isolation: isolate;
      display: grid;
      min-height: min(840px, 100svh);
      min-height: min(840px, 100vh);
      min-height: min(840px, 100svh);
      place-items: center;
      overflow: hidden;
      padding: 34px 22px;
      color: #fff;
      text-align: center;
      background: #45463c url("./Enzo%20%26%20Kat.jpg") center 48% / cover no-repeat;
    }
    .hero::before { position: absolute; z-index: -1; inset: 0; content: ""; background: linear-gradient(180deg, rgba(21, 22, 18, .28), rgba(21, 22, 18, .31) 40%, rgba(21, 22, 18, .64)); }
    .hero-content { width: min(100%, 790px); padding: 42px 18px; }
    .hero-logo { display: block; width: 100px; height: 66px; margin: 0 auto 30px; object-fit: contain; mix-blend-mode: screen; }
    .eyebrow { margin: 0 0 19px; font-size: 10px; font-weight: 500; letter-spacing: .3em; text-transform: uppercase; }
    h1 { margin: 0; font-family: var(--serif); font-size: clamp(54px, 10.5vw, 112px); font-weight: 400; line-height: 1.03; letter-spacing: -.055em; text-wrap: balance; }
    h1 .amp { display: inline-block; padding: 0 .11em; color: #e2d9c6; font-size: .66em; font-style: italic; }
    .hero-date { margin: 28px 0 0; font-size: 11px; font-weight: 500; letter-spacing: .28em; text-transform: uppercase; }
    .hero-rule { width: 46px; height: 1px; margin: 30px auto 0; background: rgba(255,255,255,.72); }
    .scroll-cue { position: absolute; bottom: 28px; left: 50%; display: grid; justify-items: center; gap: 9px; transform: translateX(-50%); color: rgba(255,255,255,.85); font-size: 9px; letter-spacing: .2em; text-decoration: none; text-transform: uppercase; }
    .scroll-cue::after { width: 1px; height: 27px; content: ""; background: rgba(255,255,255,.7); }

    .details { position: relative; padding: clamp(78px, 11vw, 132px) 24px clamp(84px, 12vw, 140px); text-align: center; }
    .details-inner { width: min(100%, 680px); margin: 0 auto; }
    .details-logo { width: 95px; height: 63px; margin: 0 auto 31px; object-fit: contain; mix-blend-mode: multiply; }
    .section-label { margin: 0 0 15px; color: var(--olive); font-size: 10px; font-weight: 600; letter-spacing: .25em; text-transform: uppercase; }
    h2 { margin: 0; font-family: var(--serif); font-size: clamp(37px, 6vw, 62px); font-weight: 400; letter-spacing: -.04em; }
    .place { margin: 15px 0 0; color: var(--olive); font-family: var(--serif); font-size: clamp(20px, 3vw, 26px); font-style: italic; }
    .detail-rule { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 31px auto; color: var(--olive); font-size: 13px; }
    .detail-rule::before, .detail-rule::after { width: 45px; height: 1px; content: ""; background: var(--line); }
    .formal-note { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: .08em; }

    footer { display: grid; min-height: 190px; place-content: center; justify-items: center; gap: 10px; padding: 31px 20px; color: var(--ivory); background: #34372f; text-align: center; }
    .footer-logo { display: block; width: 84px; height: 55px; object-fit: contain; mix-blend-mode: screen; }
    footer p { margin: 0; color: #d7d6ce; font-family: var(--serif); font-size: 15px; font-style: italic; }

    @media (min-width: 900px) { .hero { background-position: center 45%; } }
    @media (max-width: 600px) {
      .hero { min-height: 88svh; min-height: 88vh; min-height: 88svh; background-position: 54% center; }
      .hero-content { padding: 30px 12px 48px; }
      .hero-logo { width: 84px; height: 56px; margin-bottom: 27px; }
      .eyebrow { font-size: 9px; letter-spacing: .25em; }
      .hero-date { margin-top: 24px; font-size: 10px; letter-spacing: .2em; }
      .scroll-cue { bottom: 17px; }
      .details-logo { width: 82px; height: 56px; margin-bottom: 27px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#details">Skip to wedding details</a>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-content">
        <img class="hero-logo" src="./Enzo%20%26%20Kat/Logo_Light.jpg" alt="Enzo and Kat monogram">
        <p class="eyebrow">Together with our families</p>
        <h1 id="hero-title">Save the Date<br>Enzo <span class="amp">&amp;</span> Kat</h1>
        <p class="hero-date"><time datetime="2027-06-25">June 25, 2027</time></p>
        <div class="hero-rule" aria-hidden="true"></div>
      </div>
      <a class="scroll-cue" href="#details" aria-label="Scroll to wedding details">Discover</a>
    </section>

    <section class="details" id="details" aria-labelledby="details-title">
      <div class="details-inner">
        <img class="details-logo" src="./Enzo%20%26%20Kat/Logo_black.jpg" alt="">
        <p class="section-label">The beginning of forever</p>
        <h2 id="details-title">Join us in celebrating</h2>
        <p class="place">Antipolo City</p>
        <div class="detail-rule" aria-hidden="true">✦</div>
        <p class="formal-note">Formal invitation to follow</p>
      </div>
    </section>
  </main>
  <footer>
    <img class="footer-logo" src="./Enzo%20%26%20Kat/Logo_Light.jpg" alt="Enzo and Kat monogram">
    <p>We can't wait to celebrate with you.</p>
  </footer>
</body>
</html>
